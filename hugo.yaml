baseURL: "https://pemtpemt13.github.io/"
languageCode: ko
defaultContentLanguage: ko
title: "여가 살림 가이드"
theme: PaperMod
paginate: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

params:
  env: production
  description: "여가/생활편의 카테고리 인기 상품을 가격·평점·리뷰 기준으로 큐레이션하는 추천 블로그입니다."
  author: pemtpemt13
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  comments: false

  homeInfoParams:
    Title: "여가 살림 가이드"
    Content: "캠핑·취미·생활편의처럼 여가와 살림에 쓰는 물건을 가격·평점·리뷰 데이터로 비교해 고르는 기준을 정리합니다. 순위는 글마다 적힌 조회 날짜 기준입니다."

  socialIcons: []

menu:
  main:
    - name: 글 목록
      url: /posts/
      weight: 1
    - name: 태그
      url: /tags/
      weight: 2
    - name: 카테고리
      url: /categories/
      weight: 3

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

